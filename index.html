<!DOCTYPE html>
<html>
<head>
<title>Jayam AI</title>

<style>
body {
    margin: 0;
    display: flex;
    font-family: Arial;

    background: url('/static/download (1).jpg') no-repeat center center fixed;
    background-size: cover;
}

/* Overlay */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: -1;
}

/* Sidebar */
#sidebar {
    width: 250px;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    padding: 10px;
    color: white;
}

#sidebar button {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    background: #4f46e5;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

/* Main */
#main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* Header */
#header {
    padding: 15px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    text-align: center;
    color: white;
    font-size: 20px;
}

/* Messages */
#messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

/* Chat bubbles */
.msg {
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    max-width: 70%;
    color: white;
}

.user {
    background: #3b82f6;
    margin-left: auto;
}

.bot {
    background: rgba(0,0,0,0.5);
}

/* Thinking */
.thinking {
    font-style: italic;
    opacity: 0.7;
}

/* Input */
#inputArea {
    display: flex;
    padding: 15px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
}

input {
    flex: 1;
    padding: 10px;
    border-radius: 5px;
    border: none;
}

button.send {
    margin-left: 10px;
    padding: 10px;
    background: #10b981;
    color: white;
    border: none;
    border-radius: 5px;
}
</style>
</head>

<body>

<!-- Sidebar -->
<div id="sidebar">
    <button onclick="newChat()">+ New Chat</button>
    <div id="chatList"></div>
</div>

<!-- Main -->
<div id="main">

    <div id="header">✨ Jayam AI Assistant</div>

    <div id="messages"></div>

    <div id="inputArea">
        <input id="input" placeholder="Ask anything...">
        <button class="send" onclick="send()">Send</button>
    </div>

</div>

<script>

let currentChat = "chat1";

/* Load chats */
function loadChats(){
    fetch('/get_chats')
    .then(r=>r.json())
    .then(data=>{
        let list=document.getElementById("chatList");
        list.innerHTML="";

        data.forEach(id=>{
            let btn=document.createElement("button");
            btn.innerText=id;
            btn.onclick=()=>loadChat(id);
            list.appendChild(btn);
        });
    });
}

/* Load chat */
function loadChat(id){
    currentChat=id;
    document.getElementById("messages").innerHTML="";

    fetch('/get_chat/'+id)
    .then(r=>r.json())
    .then(data=>{
        data.forEach(c=>{
            add(c.user,"user");
            add(c.bot,"bot");
        });
    });
}

/* New chat */
function newChat(){
    currentChat="chat"+Date.now();
    document.getElementById("messages").innerHTML="";
}

/* Add message */
function add(text,type){
    let d=document.createElement("div");
    d.className="msg "+type;
    d.innerText=text;
    document.getElementById("messages").appendChild(d);

    document.getElementById("messages").scrollTop =
        document.getElementById("messages").scrollHeight;

    return d;
}

/* Send */
function send(){
    let input=document.getElementById("input");
    let msg=input.value.trim();

    if(msg==="") return;

    add(msg,"user");
    input.value="";

    let thinking = add("Jayam is thinking...", "bot thinking");

    fetch('/chat',{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            message:msg,
            chat_id:currentChat
        })
    })
    .then(r=>r.json())
    .then(d=>{
        thinking.remove();
        add(d.response,"bot");
        loadChats();
    });
}

/* Enter key */
document.getElementById("input").addEventListener("keypress", function(e){
    if(e.key==="Enter") send();
});

loadChats();

</script>

</body>
</html>
